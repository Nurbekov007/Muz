<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Музыка</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Музыка">
<meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--mut:#8e8e93;--ac:#fa2d48;--card:#1c1c1e;--ln:#2c2c2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:100%;height:100%;fill:currentColor;display:block}
#lib{padding:12px 16px 150px;max-width:640px;margin:0 auto}
h1{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:8px 0 12px}
#q{width:100%;background:var(--card);border:0;border-radius:10px;padding:10px 12px;color:var(--fg);font-size:17px;outline:0;margin-bottom:12px}
.add{display:block;color:var(--ac);font-weight:600;padding:8px 0 14px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row.on b{color:var(--ac)}
.cv{width:48px;height:48px;border-radius:6px;flex:none;background-size:cover}
.row div:last-child{min-width:0}
.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#empty{color:var(--mut);text-align:center;padding:40px 20px;line-height:1.5}
#mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:rgba(44,44,46,.85);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:14px;display:flex;align-items:center;gap:12px;padding:8px 12px;max-width:640px;margin:0 auto;z-index:5}
#mini[hidden]{display:none}
#mini .cv{width:44px;height:44px}
#mini .t{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px}
#np{position:fixed;inset:0;background:#1a0b0e;z-index:10;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 24px calc(env(safe-area-inset-bottom,0px) + 18px);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#np.hide{transform:translateY(105%)}
#bgc{position:absolute;inset:0;z-index:-1;transition:background .6s}
#bgc:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
#grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:0 auto 14px;flex:none}
#art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#big{width:min(84vw,44vh);aspect-ratio:1;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:transform .3s}
#np.pa #big{transform:scale(.85)}
#ly{flex:1;overflow-y:auto;min-height:0;margin:8px -8px;padding:30vh 8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 15%,#000 85%,transparent)}
#ly::-webkit-scrollbar{display:none}
#ly p{font-size:28px;font-weight:700;line-height:1.2;margin:0 0 22px;color:rgba(255,255,255,.35);transition:color .3s,transform .3s;transform-origin:left;cursor:pointer}
#ly p.on{color:#fff;transform:scale(1.04)}
#ly p.pl{color:rgba(255,255,255,.8)}
#ly .no{font-size:17px;font-weight:500;color:rgba(255,255,255,.6)}
#np.lv #art{display:none}#np:not(.lv) #ly{display:none}
#info{flex:none;margin:14px 0 6px;display:flex;align-items:center;gap:12px}
#info .cv{width:52px;height:52px;display:none}
#np.lv #info .cv{display:block}
#info>div:last-child{min-width:0}
#tt{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aa{font-size:19px;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{width:100%;height:4px;accent-color:#fff;margin:14px 0 2px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.3);border-radius:2px;flex:none}
#bar::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff}
.tm{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6);flex:none}
#ctl{display:flex;align-items:center;justify-content:center;gap:34px;margin:12px 0;flex:none}
#ctl .ib{width:44px;height:44px}#ctl .pp{width:64px;height:64px}
#ext{display:flex;justify-content:space-around;flex:none;font-size:15px;color:rgba(255,255,255,.6)}
#ext button.on,#ext label.on{color:#fff;font-weight:700}
#ext label{cursor:pointer}
</style></head><body>
<div id="lib">
<h1>Медиатека</h1>
<input id="q" type="search" placeholder="Поиск">
<label class="add">＋ Добавить песни<input id="f" type="file" multiple hidden></label>
<div id="list"></div>
<p id="empty">Выбери mp3 вместе с файлами .lrc. Если имена совпадают (например, «Artist - Song.mp3» и «Artist - Song.lrc»), текст подключится сам. Обложка: картинка с тем же именем.</p>
</div>
<div id="mini" hidden><div class="cv" id="mcv"></div><div class="t" id="mt"></div><button class="ib" id="mpp"></button><button class="ib" id="mnx"></button></div>
<div id="np" class="hide"><div id="bgc"></div><div id="grab"></div>
<div id="art"><div id="big" class="cv"></div></div><div id="ly"></div>
<div id="info"><div class="cv" id="scv"></div><div><div id="tt"></div><div id="aa"></div></div></div>
<input id="bar" type="range" min="0" max="1000" value="0"><div class="tm"><span id="c1">0:00</span><span id="c2">0:00</span></div>
<div id="ctl"><button class="ib" id="pv"></button><button class="ib pp" id="pp"></button><button class="ib" id="nx"></button></div>
<div id="ext"><button id="sh">Перемешать</button><button id="tl">Текст</button><button id="rp">Повтор</button><label id="al">+ .lrc<input id="lf" type="file" hidden></label><button id="dl">Удалить</button></div>
</div>
<audio id="au" playsinline></audio>
<script>
var $=function(s){return document.querySelector(s)};
var I={p:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',u:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',n:'<svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>',v:'<svg viewBox="0 0 24 24"><path d="M18 6l-8.5 6 8.5 6zM6 6h2v12H6z"/></svg>'};
var au=$('#au'),db=null,songs=[],cur=-1,url=null,shuf=false,rep=0,L=[],act=-1,mem=0;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hue(s){var h=0,t=s.title+s.artist;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%360;return h}
function cvs(s){if(s.cover){s._u=s._u||URL.createObjectURL(s.cover);return'background-image:url('+s._u+')'}var h=hue(s);return'background:linear-gradient(135deg,hsl('+h+' 70% 55%),hsl('+(h+50)%360+' 70% 30%))'}
function fm(t){if(!isFinite(t))t=0;var m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s}
/* storage */
function openDB(){return new Promise(function(r){try{var q=indexedDB.open('mp',1);q.onupgradeneeded=function(){q.result.createObjectStore('s',{keyPath:'id',autoIncrement:true})};q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)}}catch(e){r(null)}})}
function st(m,f){return new Promise(function(r){if(!db){r(null);return}try{var t=db.transaction('s',m),q=f(t.objectStore('s'));t.oncomplete=function(){r(q&&q.result)};t.onerror=function(){r(null)}}catch(e){r(null)}})}
async function save(s){var o={title:s.title,artist:s.artist,blob:s.blob,lrc:s.lrc,cover:s.cover};if(s.id)o.id=s.id;var id=await st('readwrite',function(o2){return o2.put(o)});s.id=id||s.id||('m'+(++mem))}
/* add files */
async function add(files){
var g={};
Array.prototype.forEach.call(files,function(f){var m=f.name.match(/^(.*)\.([^.]+)$/);if(!m)return;var b=m[1],e=m[2].toLowerCase();var k=(f.type.indexOf('audio')==0||/^(mp3|m4a|aac|wav|flac|ogg|opus)$/.test(e))?'a':/^(lrc|txt)$/.test(e)?'l':(f.type.indexOf('image')==0)?'c':'';if(k){g[b]=g[b]||{};g[b][k]=f}});
for(var b in g){var o=g[b];if(!o.a)continue;var i=b.indexOf(' - '),s={artist:i>0?b.slice(0,i):'',title:i>0?b.slice(i+3):b,blob:o.a,lrc:o.l?await o.l.text():'',cover:o.c||null};await save(s);songs.push(s)}
songs.sort(function(a,b){return a.title.localeCompare(b.title)});render()}
$('#f').onchange=function(e){add(e.target.files);e.target.value=''};
/* library */
function render(){
var q=$('#q').value.toLowerCase(),h='';
songs.forEach(function(s,i){if(q&&(s.title+' '+s.artist).toLowerCase().indexOf(q)<0)return;h+='<div class="row'+(i==cur?' on':'')+'" data-i="'+i+'"><div class="cv" style="'+cvs(s)+'"></div><div><b>'+esc(s.title)+'</b><span>'+esc(s.artist||'Неизвестный исполнитель')+'</span></div></div>'});
$('#list').innerHTML=h;$('#empty').style.display=songs.length?'none':'block'}
$('#list').onclick=function(e){var r=e.target.closest('.row');if(r)play(+r.dataset.i)};
$('#q').oninput=render;
/* playback */
function play(i){
if(i<0||i>=songs.length)return;cur=i;var s=songs[i];
if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(s.blob);au.src=url;au.loop=rep==1;
var p=au.play();if(p&&p.catch)p.catch(function(){});
ui();lyr(s);meta(s);render()}
function next(d){if(!songs.length)return;var n;if(shuf&&d>0&&songs.length>1){do{n=Math.floor(Math.random()*songs.length)}while(n==cur)}else n=(cur+d+songs.length)%songs.length;play(n)}
function tog(){if(cur<0)return;au.paused?au.play():au.pause()}
function ui(){
var s=songs[cur];if(!s)return;$('#mini').hidden=false;
var st2=cvs(s);$('#mcv').style.cssText=st2;$('#big').style.cssText=st2;$('#scv').style.cssText=st2;
$('#mt').textContent=s.title;$('#tt').textContent=s.title;$('#aa').textContent=s.artist||'Неизвестный исполнитель';
var h=hue(s);$('#bgc').style.background='linear-gradient(160deg,hsl('+h+' 60% 40%),hsl('+(h+40)%360+' 60% 12%))';
ic()}
function ic(){var x=au.paused?I.p:I.u;$('#mpp').innerHTML=x;$('#pp').innerHTML=x;$('#mnx').innerHTML=I.n;$('#nx').innerHTML=I.n;$('#pv').innerHTML=I.v;$('#np').classList.toggle('pa',au.paused)}
au.onplay=au.onpause=ic;
au.onended=function(){if(rep==0&&!shuf&&cur==songs.length-1){ic();return}next(1)};
au.ontimeupdate=function(){var d=au.duration||0,t=au.currentTime;if(!seek)$('#bar').value=d?t/d*1000:0;$('#c1').textContent=fm(t);$('#c2').textContent='-'+fm(d-t);sync(t)};
var seek=false,bar=$('#bar');
bar.oninput=function(){seek=true;$('#c1').textContent=fm(bar.value/1000*(au.duration||0))};
bar.onchange=function(){au.currentTime=bar.value/1000*(au.duration||0);seek=false};
$('#mpp').onclick=function(e){e.stopPropagation();tog()};$('#pp').onclick=tog;
$('#mnx').onclick=function(e){e.stopPropagation();next(1)};$('#nx').onclick=function(){next(1)};
$('#pv').onclick=function(){if(au.currentTime>3)au.currentTime=0;else next(-1)};
$('#sh').onclick=function(){shuf=!shuf;this.classList.toggle('on',shuf)};
$('#rp').onclick=function(){rep=(rep+1)%3;au.loop=rep==1;this.textContent=rep==1?'Повтор: 1':'Повтор';this.classList.toggle('on',rep>0)};
$('#mini').onclick=function(){$('#np').classList.remove('hide')};
$('#grab').onclick=function(){$('#np').classList.add('hide')};
var y0=0;$('#np').ontouchstart=function(e){y0=e.touches[0].clientY};
$('#np').ontouchend=function(e){if(e.target.closest('#ly,#bar')) return;if(e.changedTouches[0].clientY-y0>90)$('#np').classList.add('hide')};
$('#tl').onclick=function(){var n=$('#np');n.classList.toggle('lv');this.classList.toggle('on',n.classList.contains('lv'))};
/* lyrics */
function lyr(s){
L=[];act=-1;var t=s.lrc||'',h='';
t.split(/\r?\n/).forEach(function(l){var m=l.match(/^((?:\[\d+:\d+(?:[.:]\d+)?\])+)(.*)$/);if(m){var x=m[2].trim();m[1].replace(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g,function(_,a,b){L.push({t:+a*60+parseFloat(b.replace(':','.')),x:x})})}else if(!/^\[[a-z]+:/i.test(l)&&l.trim())L.push({t:null,x:l.trim()})});
var timed=L.some(function(l){return l.t!==null});
if(timed){L=L.filter(function(l){return l.t!==null&&l.x}).sort(function(a,b){return a.t-b.t})}
if(!L.length)h='<p class="no">Текста пока нет. Нажми «+ .lrc» внизу, чтобы добавить.</p>';
else L.forEach(function(l,i){h+='<p data-i="'+i+'"'+(timed?'':' class="pl"')+'>'+esc(l.x)+'</p>'});
$('#ly').innerHTML=h;$('#ly').scrollTop=0}
function sync(t){
if(!L.length||L[0].t===null)return;var a=-1;for(var i=0;i<L.length;i++){if(L[i].t<=t+.25)a=i;else break}
if(a==act)return;act=a;var ps=$('#ly').children;
for(var i=0;i<ps.length;i++)ps[i].classList.toggle('on',i==a);
if(a>=0&&ps[a]){var c=$('#ly'),p=ps[a];c.scrollTo({top:p.offsetTop-c.clientHeight/2+p.clientHeight/2,behavior:'smooth'})}}
$('#ly').onclick=function(e){var p=e.target.closest('p[data-i]');if(p&&L[p.dataset.i]&&L[p.dataset.i].t!==null)au.currentTime=L[p.dataset.i].t};
$('#lf').onchange=async function(e){var f=e.target.files[0];e.target.value='';if(!f||cur<0)return;var s=songs[cur];s.lrc=await f.text();await save(s);lyr(s)};
$('#dl').onclick=async function(){if(cur<0||!confirm('Удалить эту песню из медиатеки?'))return;var s=songs[cur];await st('readwrite',function(o){return o.delete(s.id)});au.pause();au.removeAttribute('src');songs.splice(cur,1);cur=-1;$('#mini').hidden=true;$('#np').classList.add('hide');render()};
/* lock screen */
function meta(s){if(!('mediaSession' in navigator))return;try{navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist||''});var m=navigator.mediaSession;m.setActionHandler('play',function(){au.play()});m.setActionHandler('pause',function(){au.pause()});m.setActionHandler('previoustrack',function(){next(-1)});m.setActionHandler('nexttrack',function(){next(1)});m.setActionHandler('seekto',function(d){au.currentTime=d.seekTime})}catch(e){}}
/* start */
(async function(){db=await openDB();var all=await st('readonly',function(o){return o.getAll()});if(all)songs=all.sort(function(a,b){return a.title.localeCompare(b.title)});ic();render()})();
</script></body></html>
